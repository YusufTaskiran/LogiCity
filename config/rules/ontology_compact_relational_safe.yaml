EntityTypes:
  - Entity

Predicates:
  - IsPedestrian:
      arity: 1
      method: IsPed(Entity)
      function: logicity.utils.pred_converter.z3.IsPed
      description: Checks if entity x is a pedestrian.
      semantic: true
  - IsCar:
      arity: 1
      method: IsCar(Entity)
      function: logicity.utils.pred_converter.z3.IsCar
      description: Checks if entity x is a car.
      semantic: true
  - IsAtInter:
      arity: 1
      method: IsAtInter(Entity)
      function: logicity.utils.pred_converter.z3.IsAtInter
      description: Checks if agent x is at the intersection entry.
      semantic: false
  - IsInInter:
      arity: 1
      method: IsInInter(Entity)
      function: logicity.utils.pred_converter.z3.IsInInter
      description: Checks if agent x is inside the intersection.
      semantic: false
  - HigherPri:
      arity: 2
      method: HigherPri(Entity, Entity)
      function: logicity.utils.pred_converter.z3.HigherPri
      description: Checks if agent x has higher priority than agent y.
      semantic: false
  - CollidingCloseStep1:
      arity: 2
      method: CollidingCloseStep1(Entity, Entity)
      function: logicity.utils.pred_converter.z3.CollidingCloseStep1
      description: Checks whether a one-step move by x conflicts with y.
      semantic: false
  - CollidingCloseStep2:
      arity: 2
      method: CollidingCloseStep2(Entity, Entity)
      function: logicity.utils.pred_converter.z3.CollidingCloseStep2
      description: Checks whether a two-step move by x conflicts with y.
      semantic: false
  - CollidingCloseStep3:
      arity: 2
      method: CollidingCloseStep3(Entity, Entity)
      function: logicity.utils.pred_converter.z3.CollidingCloseStep3
      description: Checks whether a three-step move by x conflicts with y.
      semantic: false
  - IsSafeStep1:
      arity: 1
      method: IsSafeStep1(Entity)
      function: logicity.utils.pred_converter.z3.IsSafeStep1
      description: Whether the one-step action is safe for entity x.
      semantic: false
  - IsSafeStep2:
      arity: 1
      method: IsSafeStep2(Entity)
      function: logicity.utils.pred_converter.z3.IsSafeStep2
      description: Whether the two-step action is safe for entity x.
      semantic: false
  - IsSafeStep3:
      arity: 1
      method: IsSafeStep3(Entity)
      function: logicity.utils.pred_converter.z3.IsSafeStep3
      description: Whether the three-step action is safe for entity x.
      semantic: false
  - IsSafeWait:
      arity: 1
      method: IsSafeWait(Entity)
      function: logicity.utils.pred_converter.z3.IsSafeWait
      description: Whether waiting is safe for entity x.
      semantic: false
  - Stop:
      arity: 1
      method: Stop(Entity)
      function: None
      description: Stop action.
  - Fast:
      arity: 1
      method: Fast(Entity)
      function: None
      description: Fast action.
  - Normal:
      arity: 1
      method: Normal(Entity)
      function: None
      description: Normal action.
  - Slow:
      arity: 1
      method: Slow(Entity)
      function: None
      description: Slow action.
