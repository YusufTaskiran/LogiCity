Rules:
  Sim: # how the determinist agents move
    - name: Stop
      formula: |
        Stop(entity) == Exists(
          [dummyEntity],
          Or(
            And(
              IsAtInter(entity),
              IsInInter(dummyEntity),
            ),
            And(
              IsAtInter(entity),
              IsAtInter(dummyEntity),
              HigherPri(dummyEntity, entity),
            ),
            And(
              IsCar(entity),
              IsInInter(entity),
              IsInInter(dummyEntity),
              IsCar(dummyEntity),
              HigherPri(dummyEntity, entity),
            ),
            And(
              IsCloseAhead(entity, dummyEntity)
            )
          )
        )
      description: Minimal stop rule based on occupancy, priority, and colliding forward conflict.
  Task: # how the reward/score is calculated
    - name: Proximity Collision
      description: hard safety failure for immediate deadzone or close-ahead collision risk.
      dead: true
      reward: -10
      formula: |
        Implies(Exists(
          [dummyEntity],
            Or(
              IsCloseAhead(entity, dummyEntity),
              CollidingClose(entity, dummyEntity)
            )
          ),
          Stop(entity)
        )
    - name: Occupied Intersection Entry
      description: soft safety violation for entering while another agent is already in the intersection.
      dead: false
      reward: -2
      formula: |
        Implies(Exists(
          [dummyEntity],
            And(
              IsAtInter(entity),
              IsInInter(dummyEntity)
            )
          ),
          Stop(entity)
        )
    - name: Higher Priority Entry Yield
      description: soft safety violation for not yielding at the same intersection entry to a higher-priority agent.
      dead: false
      reward: -2
      formula: |
        Implies(Exists(
          [dummyEntity],
            And(
              IsAtInter(entity),
              IsAtInter(dummyEntity),
              HigherPri(dummyEntity, entity)
            )
          ),
          Stop(entity)
        )
    - name: Higher Priority In-Intersection Yield
      description: soft safety violation for not yielding inside the same intersection to a higher-priority car.
      dead: false
      reward: -2
      formula: |
        Implies(Exists(
          [dummyEntity],
            And(
              IsCar(entity),
              IsInInter(entity),
              IsInInter(dummyEntity),
              IsCar(dummyEntity),
              HigherPri(dummyEntity, entity)
            )
          ),
          Stop(entity)
        )
  Expert: # how the expert agents should move
    - name: Stop
      description: Stop on the minimal conflict condition.
      formula: |
        Stop(entity) == Exists(
          [dummyEntity],
          Or(
            And(
              IsAtInter(entity),
              IsInInter(dummyEntity),
            ),
            And(
              IsAtInter(entity),
              IsAtInter(dummyEntity),
              HigherPri(dummyEntity, entity),
            ),
            And(
              IsCar(entity),
              IsInInter(entity),
              IsInInter(dummyEntity),
              IsCar(dummyEntity),
              HigherPri(dummyEntity, entity),
            ),
            And(
              IsCloseAhead(entity, dummyEntity)
            )
          )
        )
    - name: Slow
      description: If not stop, slow down for forward warnings.
      formula: |
        Slow(entity) == And(
          Not(Stop(entity)),
          Exists(
            [dummyEntity],
            IsAhead(entity, dummyEntity)
          )
        )
    - name: Fast
      description: If not stop or slow and not near/in the intersection, move fast on open road.
      formula: |
        Fast(entity) == And(
          Not(Stop(entity)),
          Not(Slow(entity)),
          Not(IsAtInter(entity)),
          Not(IsInInter(entity))
        )
    - name: Normal
      description: Fallback action when neither stop, slow, nor fast applies.
      formula: |
        Normal(entity) == And(
          Not(Stop(entity)),
          Not(Slow(entity)),
          Not(Fast(entity))
        )
