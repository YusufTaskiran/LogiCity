Rules:
  Sim: # how the determinist agents move
    - name: Stop
      formula: |
        Stop(entity) == Exists(
          [dummyEntity], 
          Or(
            And(
              IsAtInter(entity), 
              IsInInter(dummyEntity), 
            ),
            And(
              IsAtInter(entity), 
              IsAtInter(dummyEntity), 
              HigherPri(dummyEntity, entity),
            ),
            CollidingClose(entity, dummyEntity)
          )
        )
      description: Or version of the 3 stop rule.
  Task: # how the reward/score is calculated
    - name: Collision and Intersection
      description: should not collide.
      dead: true
      reward: -10
      formula: |
        Implies(Exists(
          [dummyEntity], 
            Or(
              And(
                IsAtInter(entity), 
                IsInInter(dummyEntity), 
              ),
              And(
                IsAtInter(entity), 
                IsAtInter(dummyEntity), 
                HigherPri(dummyEntity, entity),
              ),
              CollidingClose(entity, dummyEntity)
            )
          ),
          Stop(entity)
        )
  Expert: # how the expert agents should move
    - name: Stop
      description: should not disobey rules.
      formula: |
        Stop(entity) == Exists(
        [dummyEntity], 
          Or(
            And(
              IsAtInter(entity), 
              IsInInter(dummyEntity), 
            ),
            And(
              IsAtInter(entity), 
              IsAtInter(dummyEntity), 
              HigherPri(dummyEntity, entity),
            ),
            CollidingClose(entity, dummyEntity)
          )
        )
    - name: Slow
      description: If not stop, then slow down for earlier forward conflict warnings.
      formula: |
        Slow(entity) == And(
          Not(Stop(entity)),
          Exists(
            [dummyEntity],
            IsCloseAhead(entity, dummyEntity)
          )
        )
    - name: Fast
      description: Never take Fast action.
      formula: |
        Not(Fast(entity))
    - name: Normal
      description: If not stop or slow, then normal.
      formula: |
        Normal(entity) == And(Not(Stop(entity)), Not(Slow(entity)))
